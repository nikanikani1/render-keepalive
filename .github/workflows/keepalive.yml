name: keepalive

# 放在公开仓库里：GitHub 对公开仓库的 Actions 分钟数不收费
on:
  schedule:
    # Render 免费档 15 分钟无请求休眠，这里留 5 分钟余量
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping TidyContracts
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 120 https://tidycontracts.onrender.com/ || echo "000")
          echo "HTTP $code at $(date -u +%FT%TZ)"
